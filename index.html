<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>织锦工坊 · 安全巡检与隐患整改台</title>
<style>
  :root{
    --ink:#2c211a; --muted:#7d6f61; --paper:#f6f0e6; --card:#fffdf8; --line:#ddd0bd;
    --brocade:#8d3e3d; --brocade-dk:#6e2b2b; --gold:#c4963f; --teal:#2f6b63;
    --l1:#2f6b63; --l2:#c47d2e; --l3:#b3352c;
    --ok:#2f7d4f; --warn-bg:#fbece8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:14px}
  header.top{background:linear-gradient(120deg,#7a2e2e,#8d3e3d 55%,#a65a3a);color:#fdf6ea;
    padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid var(--gold)}
  header.top h1{margin:0;font-size:21px;letter-spacing:1px}
  header.top .sub{font-size:12px;opacity:.85;margin-top:2px}
  .spacer{flex:1}
  .role-seg{display:flex;background:rgba(0,0,0,.22);border-radius:10px;padding:3px;gap:2px}
  .role-seg button{border:0;background:transparent;color:#f7ead6;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px}
  .role-seg button.active{background:#fdf6ea;color:var(--brocade-dk)}
  .role-extra{display:flex;align-items:center;gap:8px}
  .role-extra input,.role-extra select{background:#fdf6ea;border:1px solid #caa98a;border-radius:8px;padding:7px 9px;font:inherit;color:var(--ink);min-width:130px}
  .icon-btn{border:1px solid rgba(253,246,234,.55);background:rgba(255,255,255,.08);color:#fdf6ea;border-radius:8px;padding:7px 11px;cursor:pointer;font-weight:700}

  .kpis{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;padding:14px 18px 0}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .kpi .n{font-size:22px;font-weight:800}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .kpi.danger .n{color:var(--l3)}
  .kpi.warn .n{color:var(--l2)}

  .restrict-banner{margin:14px 18px 0;background:var(--warn-bg);border:1px solid #e2b3ab;border-left:6px solid var(--l3);
    border-radius:10px;padding:11px 14px;color:#7a241d;font-weight:700;display:none}
  .restrict-banner b{color:var(--l3)}
  .restrict-banner a{color:var(--brocade-dk);text-decoration:underline;cursor:pointer;margin-left:6px}

  main{padding:14px 18px 40px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:20px;padding:8px 16px;cursor:pointer;font-weight:700}
  .tabs button.active{background:var(--brocade);border-color:var(--brocade);color:#fff}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel h2{margin:0 0 4px;font-size:16px}
  .panel .hint{color:var(--muted);font-size:12px;margin:0 0 12px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .toolbar input,.toolbar select{border:1px solid var(--line);border-radius:8px;padding:8px 9px;font:inherit;background:#fff}
  .toolbar input[type=text]{min-width:180px}

  button.btn{border:0;border-radius:8px;padding:8px 14px;background:var(--brocade);color:#fff;font-weight:700;cursor:pointer}
  button.btn:hover{background:var(--brocade-dk)}
  button.btn.teal{background:var(--teal)}
  button.btn.ghost{background:#fff;color:var(--brocade-dk);border:1px solid var(--line)}
  button.btn.gray{background:#7d6f61}
  button.btn.sm{padding:5px 10px;font-size:12px}
  button:disabled{opacity:.45;cursor:not-allowed}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #ece2d3;font-size:13px;vertical-align:top}
  th{color:var(--muted);font-size:12px;background:#faf4e9;position:sticky;top:0}
  tr:hover td{background:#fbf6ee}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
  .l1{background:#e3f0ee;color:var(--l1)}
  .l2{background:#f8ecd9;color:var(--l2)}
  .l3{background:#f8e2df;color:var(--l3)}
  .st-open{background:#fdeed8;color:#a8671f}
  .st-done{background:#e5f1e9;color:var(--ok)}
  .st-rejected{background:#f8e2df;color:var(--l3)}
  .st-closed{background:#e7e9ee;color:#4b5563}
  .st-overdue{background:#f3d2ce;color:#7a241d}
  .pill-off{background:#ece2d3;color:var(--muted)}
  .pill-on{background:#e3f0ee;color:var(--teal)}
  .due{font-variant-numeric:tabular-nums}
  .due.over{color:var(--l3);font-weight:800}
  .due.soon{color:var(--l2);font-weight:700}
  .muted{color:var(--muted)}
  .danger{color:var(--l3);font-weight:700}
  .lock-note{font-size:12px;color:var(--l3);margin-top:6px}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .orderlink{color:var(--brocade-dk);cursor:pointer;text-decoration:underline;font-weight:700}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .area-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
  .area-card.restricted{border-color:#e2b3ab;background:var(--warn-bg)}
  .area-card h3{margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .item-row{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid #ece2d3;border-radius:8px;margin-top:8px;background:#fdfaf4}
  .item-row.off{opacity:.55}
  .item-row .txt{flex:1}
  .item-row .txt small{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .sla-row{display:flex;align-items:center;gap:10px;margin:8px 0}
  .sla-row .tag{min-width:78px;text-align:center}
  .sla-row input{width:90px;border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit}
  .timeline{border-left:3px solid #e3d5c1;margin:8px 0 0 6px;padding-left:14px}
  .timeline .ev{margin-bottom:12px}
  .timeline .ev .t{font-size:12px;color:var(--muted)}
  .timeline .ev b{font-size:13px}
  .rect-box{background:#faf4e9;border:1px solid #ece2d3;border-radius:8px;padding:10px;margin:8px 0;white-space:pre-wrap}
  .review-box{background:#f3f7f6;border:1px solid #d8e6e3;border-radius:8px;padding:10px;margin:8px 0;white-space:pre-wrap}
  .modal-mask{position:fixed;inset:0;background:rgba(44,33,26,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:var(--card);border-radius:14px;width:min(680px,100%);max-height:88vh;overflow:auto;padding:20px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
  .modal h3{margin:0 0 12px;font-size:17px}
  .modal label{display:block;margin:11px 0 5px;color:var(--muted);font-size:12px;font-weight:700}
  .modal input[type=text],.modal input[type=number],.modal input[type=datetime-local],.modal select,.modal textarea{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;background:#fff}
  .modal textarea{min-height:84px;resize:vertical}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .modal .inline{display:flex;gap:10px}
  .modal .inline>div{flex:1}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px}
  .kv div:nth-child(odd){color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#33271f;color:#fdf6ea;padding:10px 18px;border-radius:24px;
    font-weight:700;opacity:0;transition:opacity .25s;z-index:99;pointer-events:none;max-width:80vw;text-align:center}
  .toast.show{opacity:.96}
  .legend{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.9}
  .legend .tag{margin-right:6px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:8px 0 26px}
  @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>🪡 织锦工坊 · 安全巡检与隐患整改台</h1>
    <div class="sub">区域巡检 · 分级整改 · 逾期升级 · 复核闭环</div>
  </div>
  <div class="spacer"></div>
  <div class="role-extra" id="roleExtra"></div>
  <div class="role-seg" id="roleSeg">
    <button data-role="admin">管理员</button>
    <button data-role="inspector">巡检员</button>
    <button data-role="person">责任人</button>
  </div>
  <button class="icon-btn" id="helpBtn">流程说明</button>
</header>

<section class="kpis" id="kpis"></section>
<div class="restrict-banner" id="restrictBanner"></div>

<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>

<footer>数据保存在本机浏览器（localStorage），刷新后全部记录保留 · 整改单状态实时刷新，逾期自动升级</footer>

<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= 常量 ================= */
const STORE_KEY = "brocade_safety_v1";
const LEVELS = [
  { key:1, name:"一般隐患", cls:"l1" },
  { key:2, name:"较重隐患", cls:"l2" },
  { key:3, name:"严重隐患", cls:"l3" }
];
const STATUS = {
  open:     { name:"待整改", cls:"st-open" },
  rejected: { name:"退回重做", cls:"st-rejected" },
  done:     { name:"待复核", cls:"st-done" },
  closed:   { name:"已闭环", cls:"st-closed" }
};
const SWEEP_MS = 15000;

/* ================= 数据层 ================= */
var db = null;
function seed(){
  const now = Date.now();
  return {
    seq: 1,
    areas: [
      { id:"a1", name:"染色车间", desc:"天然染料调配与煮染作业区" },
      { id:"a2", name:"织造车间", desc:"手工织机集中作业区" },
      { id:"a3", name:"成品库房", desc:"织锦成品与包装物料存放区" },
      { id:"a4", name:"染料仓", desc:"染料、助剂等危化品存放区" }
    ],
    persons: [
      { id:"p1", name:"周巧娘", role:"车间主任", phone:"内线 801" },
      { id:"p2", name:"石大壮", role:"设备维修", phone:"内线 802" },
      { id:"p3", name:"苗青",   role:"库房主管", phone:"内线 803" },
      { id:"p4", name:"龙安全", role:"安全员",   phone:"内线 804" }
    ],
    items: [
      { id:"i1", areaId:"a1", code:"RS-01", text:"煮染锅周边防烫护栏完好", active:true },
      { id:"i2", areaId:"a1", code:"RS-02", text:"染料废液按规定收集处理", active:true },
      { id:"i3", areaId:"a1", code:"RS-03", text:"排风扇运转正常、通风良好", active:true },
      { id:"i4", areaId:"a2", code:"ZZ-01", text:"织机传动部位防护罩齐全", active:true },
      { id:"i5", areaId:"a2", code:"ZZ-02", text:"电气线路无私拉乱接、无老化破损", active:true },
      { id:"i6", areaId:"a2", code:"ZZ-03", text:"消防通道畅通、灭火器在有效期内", active:true },
      { id:"i7", areaId:"a2", code:"ZZ-04", text:"棉纱飞絮及时清扫，无积尘", active:true },
      { id:"i8", areaId:"a3", code:"KF-01", text:"库房照明灯具与货物保持安全距离", active:true },
      { id:"i9", areaId:"a3", code:"KF-02", text:"货物堆放稳固、限高线清晰", active:true },
      { id:"i10",areaId:"a4", code:"RC-01", text:"危化品分区分类存放、标识清楚", active:true },
      { id:"i11",areaId:"a4", code:"RC-02", text:"应急洗眼器可用、防泄漏沙箱齐备", active:true },
      { id:"i12",areaId:"a4", code:"RC-03", text:"出入库双人登记落锁", active:false }
    ],
    orders: [],
    inspections: [],
    config: { slaHours: { 1:24, 2:8, 3:2 } }, // 一般24h / 较重8h / 严重2h
    ui: { role:"inspector", tab:{ admin:"master", inspector:"inspect", person:"todo" },
          inspectorName:"巡检验收员", personId:"p1" }
  };
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw){ db = seed(); save(); return; }
    db = JSON.parse(raw);
    // 兼容补字段
    if(!db.config) db.config = { slaHours:{1:24,2:8,3:2} };
    if(!db.ui) db.ui = { role:"inspector", tab:{admin:"master",inspector:"inspect",person:"todo"}, inspectorName:"巡检验收员", personId:(db.persons[0]||{}).id||"" };
    if(!db.ui.tab) db.ui.tab = { admin:"master", inspector:"inspect", person:"todo" };
  }catch(e){ db = seed(); save(); }
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
function uid(prefix){ return prefix + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
function nextCode(){
  const d = new Date();
  const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  return "ZG" + ymd + "-" + String(db.seq++).padStart(3,"0");
}

/* ================= 查询辅助 ================= */
const areaName = id => { const a=db.areas.find(x=>x.id===id); return a?a.name:"（已删除区域）"; };
const personName = id => { const p=db.persons.find(x=>x.id===id); return p?p.name:"（待指派）"; };
const itemRef = id => db.items.find(x=>x.id===id);
const lvl = k => LEVELS.find(l=>l.key===k) || LEVELS[0];
function itemLabel(it){ if(!it) return "（已删除检查项）"; return (it.code?it.code+" ":"") + it.text; }
function openOrdersByItem(itemId){ return db.orders.filter(o=>o.itemId===itemId && o.status!=="closed"); }
function openHighOrdersOfArea(areaId){ return db.orders.filter(o=>o.areaId===areaId && o.level===3 && o.status!=="closed"); }
function restrictedAreas(){
  const set = new Set();
  db.orders.forEach(o=>{ if(o.level===3 && o.status!=="closed") set.add(o.areaId); });
  return set;
}
function slaMs(level){ return Number(db.config.slaHours[level]||0) * 3600000; }
function isOverdue(o){ return (o.status==="open"||o.status==="rejected") && Date.now() > o.deadline; }

/* ================= 业务动作 ================= */
// 巡检记录：合格或问题；问题自动开单
function recordInspection({ itemId, ok, level, assignee, note, inspectorName }){
  const it = itemRef(itemId);
  if(!it) throw new Error("检查项不存在");
  if(!ok){
    if(openOrdersByItem(itemId).length) throw new Error("该检查项已有未闭环整改单，不能重复开单");
    if(openHighOrdersOfArea(it.areaId).length) throw new Error("该区域因严重隐患已被限制，请先完成严重隐患整改复核");
    if(!assignee) throw new Error("请选择整改责任人");
    const now = Date.now();
    const order = {
      id: uid("o"), code:nextCode(), itemId, areaId:it.areaId,
      level, assignee,
      status:"open", createAt:now, deadline: now + slaMs(level),
      openedBy: inspectorName || "巡检员",
      problemNote: (note||"").trim(),
      rectifyNote:"", rectifyAt:null, rectifyTimes:0,
      reviewNote:"", reviewAt:null, reviewer:"",
      history:[{ at:now, type:"create", by:inspectorName||"巡检员",
        text:"按 "+lvl(level).name+" 开单，限期 "+fmtDateTime(now+slaMs(level))+(note?"；问题描述："+note:"") }]
    };
    db.orders.unshift(order);
    db.inspections.unshift({ id:uid("r"), itemId, areaId:it.areaId, at:now, ok:false, level,
      note:(note||"").trim(), by:inspectorName||"巡检员", orderId:order.id });
    save();
    return order;
  }else{
    db.inspections.unshift({ id:uid("r"), itemId, areaId:it.areaId, at:Date.now(), ok:true, level:null,
      note:(note||"").trim(), by:inspectorName||"巡检员", orderId:null });
    save();
    return null;
  }
}

// 逾期自动升级（每次每单只升一级，避免一次跳满）
function sweepOverdue(){
  const now = Date.now(); let changed = false;
  db.orders.forEach(o=>{
    if((o.status==="open"||o.status==="rejected") && now > o.deadline && o.level < 3){
      o.level++;
      o.deadline = now + slaMs(o.level);
      o.history.push({ at:now, type:"escalate", by:"系统",
        text:"逾期未闭环，自动升级为「"+lvl(o.level).name+"」，期限重算至 "+fmtDateTime(o.deadline) });
      changed = true;
    }
  });
  if(changed) save();
  return changed;
}

// 责任人提交整改
function submitRectify(orderId, note, by){
  const o = db.orders.find(x=>x.id===orderId);
  if(!o) throw new Error("整改单不存在");
  if(o.status==="closed") throw new Error("该单已闭环");
  if(o.status==="done") throw new Error("已提交，等待复核");
  if(!note.trim()) throw new Error("请填写整改说明");
  const now = Date.now();
  o.rectifyNote = note.trim(); o.rectifyAt = now; o.rectifyTimes++;
  o.status = "done";
  o.history.push({ at:now, type:"submit", by, text:"提交整改说明，等待复核" });
  save();
}

// 复核：通过闭环 / 不通过退回并重新起算期限
function reviewOrder(orderId, pass, note, reviewer){
  const o = db.orders.find(x=>x.id===orderId);
  if(!o) throw new Error("整改单不存在");
  if(o.status!=="done") throw new Error("当前状态不可复核");
  const now = Date.now();
  if(pass){
    o.status="closed"; o.reviewNote=note.trim(); o.reviewAt=now; o.reviewer=reviewer;
    o.history.push({ at:now, type:"pass", by:reviewer, text:"复核通过，整改闭环"+(note.trim()?"："+note.trim():"") });
  }else{
    if(!note.trim()) throw new Error("退回必须填写复核意见");
    o.status="rejected"; o.reviewNote=note.trim(); o.reviewAt=now; o.reviewer=reviewer;
    o.deadline = now + slaMs(o.level);
    o.history.push({ at:now, type:"reject", by:reviewer,
      text:"复核不通过，退回责任人重做，期限重新起算至 "+fmtDateTime(o.deadline)+"；意见："+note.trim() });
  }
  save();
}

// 管理员调整等级：同步重算期限与区域限制
function changeLevel(orderId, level, by){
  const o = db.orders.find(x=>x.id===orderId);
  if(!o) throw new Error("整改单不存在");
  if(o.status==="closed") throw new Error("已闭环的整改单不可调整等级");
  if(o.level===level) return;
  const now = Date.now();
  const old = lvl(o.level).name;
  o.level = level;
  // 无论待整改还是待复核，期限一律按新等级从当前时刻重算，区域限制由等级自动联动
  o.deadline = now + slaMs(level);
  o.history.push({ at:now, type:"level", by,
    text:"等级由「"+old+"」调整为「"+lvl(level).name+"」，期限同步重算至 "+fmtDateTime(o.deadline)
      +(level===3?"；该区域即刻进入受限状态":(old&&level<3?"；若区域内无其他严重未闭环单，区域限制解除":"")) });
  save();
}

/* ================= 基础数据维护 ================= */
function saveArea(id, data){
  if(id){ const a=db.areas.find(x=>x.id===id); Object.assign(a,data); }
  else db.areas.push({ id:uid("a"), name:"", desc:"", ...data });
  save();
}
function removeArea(id){
  if(db.orders.some(o=>o.areaId===id)) throw new Error("该区域已有整改单记录，不可删除（可保留并停止新增检查项）");
  db.areas = db.areas.filter(a=>a.id!==id);
  db.items = db.items.filter(i=>i.areaId!==id);
  save();
}
function saveItem(id, data){
  if(id){ const it=db.items.find(x=>x.id===id); Object.assign(it,data); }
  else db.items.push({ id:uid("i"), active:true, ...data });
  save();
}
function toggleItem(id){ const it=db.items.find(x=>x.id===id); it.active=!it.active; save(); }
function removeItem(id){
  if(db.orders.some(o=>o.itemId===id)) throw new Error("该检查项已开单，不可删除；停用即可，停用不影响已开整改单");
  db.items = db.items.filter(i=>i.id!==id); save();
}
function savePerson(id, data){
  if(id){ const p=db.persons.find(x=>x.id===id); Object.assign(p,data); }
  else db.persons.push({ id:uid("p"), ...data });
  save();
}
function removePerson(id){
  if(db.orders.some(o=>o.assignee===id)) throw new Error("该责任人名下已有整改单，不可删除");
  db.persons = db.persons.filter(p=>p.id!==id); save();
}
function saveSla(hours, by){
  [1,2,3].forEach(k=>{ db.config.slaHours[k] = Number(hours[k]); });
  save();
}

/* ================= 格式化 ================= */
function fmtDateTime(ts){
  if(!ts) return "—";
  const d=new Date(ts), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function remainText(o){
  if(o.status==="closed") return "已闭环";
  if(o.status==="done") return "已提交，待复核";
  const ms = o.deadline - Date.now();
  const abs = Math.abs(ms);
  const h = Math.floor(abs/3600000), m = Math.floor(abs%3600000/60000), s = Math.floor(abs%60000/1000);
  let txt;
  if(h>0) txt = h+"小时"+m+"分";
  else if(m>0) txt = m+"分"+s+"秒";
  else txt = s+"秒";
  return ms>=0 ? "剩余 "+txt : "已逾期 "+txt;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function levelTag(k){ const l=lvl(k); return '<span class="tag '+l.cls+'">'+l.name+'</span>'; }
function statusTag(o){
  const overdue = isOverdue(o);
  if(overdue) return '<span class="tag st-overdue">逾期·'+STATUS[o.status].name+'</span>';
  return '<span class="tag '+STATUS[o.status].cls+'">'+STATUS[o.status].name+'</span>';
}

function renderKpis(){
  const open = db.orders.filter(o=>o.status!=="closed");
  const overdue = open.filter(isOverdue);
  const high = open.filter(o=>o.level===3);
  const done = db.orders.filter(o=>o.status==="done");
  const rejected = open.filter(o=>o.status==="rejected");
  const today = new Date(); today.setHours(0,0,0,0);
  const todayCount = db.inspections.filter(r=>r.at>=today.getTime()).length;
  const cards=[
    {n:db.inspections.length, l:"累计巡检记录"},
    {n:open.length, l:"未闭环整改单", cls:open.length?"warn":""},
    {n:overdue.length, l:"逾期待处理", cls:overdue.length?"danger":""},
    {n:high.length, l:"严重隐患未闭环", cls:high.length?"danger":""},
    {n:done.length, l:"待复核"},
    {n:todayCount, l:"今日巡检次数"}
  ];
  document.getElementById("kpis").innerHTML=cards.map(c=>
    '<div class="kpi '+c.cls+'"><div class="n">'+c.n+'</div><div class="l">'+c.l+'</div></div>').join("");
}

function renderBanner(){
  const el=document.getElementById("restrictBanner");
  const set=restrictedAreas();
  if(!set.size){ el.style.display="none"; return; }
  const names=[...set].map(id=>{
    const cnt=openHighOrdersOfArea(id).length;
    return "<b>"+esc(areaName(id))+"</b>（严重未闭环 "+cnt+" 单）";
  }).join("、");
  el.style.display="block";
  el.innerHTML='⛔ 区域受限：'+names+'。该区域暂停新巡检开单，须等严重隐患整改并全部复核通过后自动恢复。'+
    '<a id="bannerGo">查看严重整改单</a>';
  document.getElementById("bannerGo").onclick=()=>{

}

/* ================= 渲染：标签与视图 ================= */
function render(){
  renderHeader(); renderKpis(); renderBanner();
  document.getElementById("tabs").innerHTML=TABS[role()].map(t=>
    '<button class="'+(t.key===tab()?"active":"")+'" data-tab="'+t.key+'">'+t.name+'</button>').join("");
  document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
  const v=document.getElementById("view");
  if(role()==="admin") v.innerHTML = tab()==="master" ? viewMaster() : tab()==="sla" ? viewSla() : viewOrders({admin:true});
  if(role()==="inspector") v.innerHTML = tab()==="inspect" ? viewInspect() : tab()==="review" ? viewReview() : tab()==="records" ? viewRecords() : viewOrders({});
  if(role()==="person") v.innerHTML = tab()==="todo" ? viewPerson() : viewOrders({person:true});
  bindView(); bindSpecial();
}
function bindView(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.onclick=()=>routeAction(el.dataset.act, el.dataset.id);
  });
}
function routeAction(act,id){
  try{
    switch(act){
      // 基础数据
      case "area-add": return areaModal(null);
      case "area-edit": return areaModal(id);
      case "area-del": return confirmAct("确认删除区域「"+areaName(id)+"」？该区域下检查项将一并移除。",()=>{removeArea(id);toast("区域已删除");render();});
      case "item-add": return itemModal(null, id);   // id = areaId
      case "item-edit": return itemModal(id, null);
      case "item-toggle": { toggleItem(id); toast(itemRef(id).active?"检查项已启用":"检查项已停用（不影响已开整改单）"); return render(); }
      case "item-del": return confirmAct("确认删除该检查项？",()=>{removeItem(id);toast("已删除");render();});
      case "person-add": return personModal(null);
      case "person-edit": return personModal(id);
      case "person-del": return confirmAct("确认删除该责任人？",()=>{removePerson(id);toast("责任人已删除");render();});
      // 巡检
      case "item-ok": return inspectModal(id, true);
      case "item-bad": return inspectModal(id, false);
      case "locked-bad": return toast("该区域因严重隐患已受限：暂停新开整改单，请先完成严重隐患整改并复核通过；仍可记录合格");
      // 整改单
      case "order-open": return openOrder(id);
      case "order-submit": return submitModal(id);
      case "order-review": return reviewModal(id);
      case "order-level": return levelModal(id);
      case "sla-save": return openSlaModal();
    }
  }catch(e){ toast(e.message); }
}
function confirmAct(text, fn){
  modal('<h3>请确认</h3><p>'+esc(text)+'</p><div class="actions">'+
    '<button class="btn ghost" onclick="closeModal()">取消</button>'+
    '<button class="btn" id="okBtn">确认</button></div>');
  document.getElementById("okBtn").onclick=()=>{ closeModal(); try{fn();}catch(e){toast(e.message);} };
}

/* ================= 视图：等级期限配置 ================= */
function viewSla(){
  const s=db.config.slaHours;
  const rows=LEVELS.map(l=>
    '<div class="sla-row">'+levelTag(l.key)+
      ' 开单/重做期限 <input type="number" min="0" step="0.1" id="sla-'+l.key+'" value="'+s[l.key]+'"> 小时'+
      '（'+s[l.key]+' 小时 ≈ '+fmtDur(s[l.key]*3600000)+'）</div>').join("");
  return '<div class="panel" style="max-width:760px"><h2>等级期限与升级规则</h2>'+
    '<p class="hint">整改单按等级确定整改期限；逾期未闭环自动升高一级并按新等级重新起算期限，直至「严重隐患」。调整等级也会同步重算期限并联动区域限制。</p>'+
    rows+
    '<div class="legend"><b>规则说明</b><br>'+
    '<span class="tag l1">一般隐患</span><span class="tag l2">较重隐患</span><span class="tag l3">严重隐患</span> 等级依次升高<br>'+
    '· 逾期升级链：一般 → 较重 → 严重，每次逾期只升一级<br>'+
    '· 复核不通过退回重做，期限从退回时刻重新起算<br>'+
    '· 严重隐患未闭环期间，所在<span class="danger">区域受限</span>（暂停新巡检开单）；全部复核通过后自动恢复<br>'+
    '· 同一检查项存在未闭环整改单时，不能重复开单<br>'+
    '· 检查项停用不影响已开整改单的流转</div>'+
    '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn" id="slaSave">保存期限设置</button>'+
    '<button class="btn ghost" id="slaDemo">演示用短周期（3 / 2 / 1 分钟）</button>'+
    '<button class="btn gray" id="slaReset">恢复默认（24 / 8 / 2 小时）</button></div></div>';
}
function fmtDur(ms){ const m=Math.round(ms/60000); if(m<60) return m+" 分钟"; return Math.floor(m/60)+" 小时"+(m%60?m%60+" 分":""); }
function openSlaModal(){
  const get=k=>parseFloat(document.getElementById("sla-"+k).value);
  if([1,2,3].some(k=>!(get(k)>=0))) return toast("请填写有效的期限小时数");
  saveSla({1:get(1),2:get(2),3:get(3)}); toast("期限设置已保存（仅影响新产生/新重算的期限）"); render();
}

  const restricted=restrictedAreas();

  const cards=db.areas.map(a=>{
    const its=db.items.filter(i=>i.areaId===a.id&&i.active);
    const lock=restricted.has(a.id);
    const high=openHighOrdersOfArea(a);
    return '<div class="area-card'+(lock?" restricted":"")+'">'+
      '<h3>'+esc(a.name)+(lock?' <span class="tag l3">区域受限</span>':'')+'</h3>'+
      '<div class="muted" style="font-size:12px;margin-bottom:6px">'+esc(a.desc)+'</div>'+
      (lock?'<div class="lock-note">⛔ 严重隐患未闭环，本区域暂停新巡检开单：'+

      (its.length?its.map(i=>inspectRow(i,lock)).join(""):'<div class="muted" style="margin-top:8px">暂无启用的检查项</div>')+

  }).join("");
  return '<div class="panel"><h2>现场逐项巡检</h2>'+
    '<p class="hint">逐项判定「合格」或「问题」。判定问题时选择隐患等级与责任人，系统按等级自动开单并写明期限；同一检查项未闭环时不能重复开单。当前巡检员：<b>'+esc(db.ui.inspectorName||"（未署名）")+'</b></p>'+
    '<div class="cards">'+cards+'</div>';
}
function inspectRow(i, areaLocked){
  const opens=openOrdersByItem(i.id);
  const busy=opens.length>0;
  const last=db.inspections.find(r=>r.itemId===i.id);
  return '<div class="item-row'+(busy?"":"")+'"><div class="txt"><b>'+esc(i.code)+'</b> '+esc(i.text)+'<br>'+
    '<small>'+(last?(last.ok?'上次：合格':'上次：问题 '+(last.orderId?'（已开单）':""))+' · '+fmtDateTime(last.at):'尚无巡检记录')+
    (busy?' · <span class="danger">整改中，禁止重复开单</span>':'')+'</small></div>'+
    (busy?('<button class="btn ghost sm" data-act="order-open" data-id="'+opens[0].id+'">查看整改单</button>')
      : ('<button class="btn teal sm" data-act="item-ok" data-id="'+i.id+'">✓ 合格</button> '+
         (areaLocked
           ? '<button class="btn sm" data-act="locked-bad" data-id="'+i.id+'" title="区域受限期间禁止新开单">✗ 问题</button>'
           : '<button class="btn sm" data-act="item-bad" data-id="'+i.id+'">✗ 问题</button>')))+
    '</div>';
}
function inspectModal(itemId, ok){
  const it=itemRef(itemId);
  if(ok){
    modal('<h3>巡检合格记录</h3><p>检查项：<b>'+esc(itemLabel(it))+'</b><br><span class="muted">'+esc(areaName(it.areaId))+'</span></p>'+

      '<label>整改责任人</label><select id="f-assignee">'+
        db.persons.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'（'+esc(p.role)+'）</option>').join("")+'</select>'+
      '<label>问题描述</label><textarea id="f-note" placeholder="描述发现的问题、位置、风险等"></textarea>'+
      '<div class="actions"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" id="okBtn">生成整改单</button></div>');

function orderRows(list, opts){
  return list.map(o=>{
    const actions=orderActions(o,opts);
    return '<tr>'+
      '<td><span class="orderlink" data-act="order-open" data-id="'+o.id+'">'+o.code+'</span><br>'+
        '<small class="muted">'+fmtDateTime(o.createAt)+'</small></td>'+
      '<td>'+esc(areaName(o.areaId))+'<br><small class="muted">'+esc(itemLabel(itemRef(o.itemId)))+'</small></td>'+
      '<td>'+levelTag(o.level)+'</td>'+
      '<td>'+statusTag(o)+'</td>'+
      '<td>'+esc(personName(o.assignee))+'</td>'+
      '<td class="due '+(isOverdue(o)?"over":(((o.deadline-Date.now())<3600000&&o.status!=="closed")?"soon":""))+'" data-deadline="'+o.id+'">'+
        '<div>'+fmtDateTime(o.deadline)+'</div><small>'+remainText(o)+'</small></td>'+
      '<td>'+actions+'</td></tr>';
  }).join("");
}
function orderActions(o,opts){
  const btns=['<button class="btn ghost sm" data-act="order-open" data-id="'+o.id+'">详情</button>'];
  if(opts.person && o.assignee===db.ui.personId && (o.status==="open"||o.status==="rejected"))
    btns.push('<button class="btn sm" data-act="order-submit" data-id="'+o.id+'">提交整改</button>');
  if(!opts.person && o.status==="done")
    btns.push('<button class="btn teal sm" data-act="order-review" data-id="'+o.id+'">复核</button>');
  if(opts.admin && o.status!=="closed")
    btns.push('<button class="btn gray sm" data-act="order-level" data-id="'+o.id+'">调整等级</button>');
  return btns.join(" ");
}
function viewOrders(opts){
  const all=opts.person ? db.orders.filter(o=>o.assignee===db.ui.personId) : db.orders.slice();
  const fkey = opts.person ? "personOrderFilter" : (opts.admin ? "adminOrderFilter" : "inspOrderFilter");
  const filter = window[fkey] || (opts.person?"open":"all");
  const list = filter==="all" ? all : filter==="open" ? all.filter(o=>o.status!=="closed") : all.filter(o=>o.status===filter);
  const fBtn=(k,name)=>'<button class="btn '+(filter===k?"":"ghost")+' sm" data-filter="'+k+'">'+name+'</button>';
  return '<div class="panel"><h2>'+(opts.admin?"整改单总表（管理员）":opts.person?"与我相关的整改单":"整改单总表")+'</h2>'+
    '<p class="hint">共 '+all.length+' 单；未闭环 '+all.filter(o=>o.status!=="closed").length+' 单；逾期 '+all.filter(isOverdue).length+' 单。点击单号查看完整流转记录。</p>'+
    '<div class="toolbar">'+fBtn("all","全部")+fBtn("open","未闭环")+fBtn("done","待复核")+fBtn("rejected","退回重做")+fBtn("closed","已闭环")+'</div>'+
    (list.length?'<div style="overflow:auto"><table><thead><tr><th>单号</th><th>区域 / 检查项</th><th>等级</th><th>状态</th><th>责任人</th><th>期限</th><th>操作</th></tr></thead><tbody>'+

}

/* ================= 定时：倒计时与逾期扫描 ================= */
var lastOverdueIds = null;
function tick(){
  const changed=sweepOverdue();
  const overdueIds = db.orders.filter(isOverdue).map(o=>o.id).join(",");
  const overdueChanged = overdueIds !== lastOverdueIds;
  lastOverdueIds = overdueIds;
  if(changed || overdueChanged){
    render();
    if(modalOrderId && document.getElementById("modalMask").style.display==="flex") openOrder(modalOrderId);
    return;
  }
  // 轻量刷新：只更新期限相关文案
  document.querySelectorAll("[data-deadline]").forEach(span=>{
    const o=db.orders.find(x=>x.id===span.dataset.deadline); if(!o) return;
    span.classList.toggle("over",isOverdue(o));
    const sm=span.querySelector("small");
    if(sm) sm.textContent=remainText(o);
  });
  // KPI 与受限横幅实时更新（弹窗打开时不重绘，避免干扰表单输入）
  if(document.getElementById("modalMask").style.display!=="flex"){
    renderKpis(); renderBanner();
  }
}
setInterval(tick, 1000);
setInterval(()=>{ if(sweepOverdue()) render(); }, SWEEP_MS);
